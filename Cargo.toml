[package]
name = "hipp-player"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.9.2"
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
md5 = "0.8.1"
once_cell = "1.21.4"
rand = "0.10.2"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["query", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tui-input = "0.15.4"
log = "0.4.33"
dirs = "6.0.0"
rusqlite = { version = "0.40.2", features = ["chrono", "bundled"] }
keyring = "4.1.6"
aes-gcm = "0.11.1"
serde_rusqlite = "0.43.0"
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"

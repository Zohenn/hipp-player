[package]
name = "hipp-core"
version = "0.2.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
color-eyre = "0.6.5"
dirs = "6.0.0"
hex = "0.4.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
keyring = "4.1.6"
lru = "0.18.5"
md5 = "0.8.1"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["query", "json", "stream"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "dither", "flac", "mp3", "mp4", "vorbis", "wav"] }
rusqlite = { version = "0.40.2", features = ["chrono", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_rusqlite = "0.43.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
webp = { version = "0.3.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.10.0"
